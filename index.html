a{color:var(--uv);font-weight:700}

<script>
'use strict';
/* ---------- App-Infos ---------- */
const VERSION = '1.5.0', RELEASED = '27.11.2026', AUTHOR = 'Hendrik Behrens', CONTACT = 'Hendrik.Behrens.to@gmx.de', YEAR = 2026;

/* ---------- Helfer ---------- */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const mondayOf = d => { const x = new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate() - (x.getDay()+6)%7); return x; };
const wdOf = s => (parse(s).getDay()+6)%7;
const todayStr = () => ymd(new Date());
const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function isoWeek(d){
  const t = new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay()||7));
  const y = t.getUTCFullYear();
  const w = Math.ceil(((t - Date.UTC(y,0,1))/864e5 + 1)/7);
  return {y, w, key:`${y}-W${pad(w)}`};
}

/* ---------- Daten ---------- */
const KEY = 'workout_planer_v1';
function seed(){ return {blocks:[], entries:[], settings:{}}; }
let S = (() => { try { const j = JSON.parse(localStorage.getItem(KEY)); if (j && j.blocks && j.entries) return j; } catch(e){} return seed(); })();

const counted = () => { const td = todayStr(); return S.entries.filter(e => e.done === true && e.date < td && blockOf(e)); };
function learnedTime(blockId, wd){
  const b = S.blocks.find(x => x.id === blockId);
  const c = counted().filter(e => e.blockId === blockId);
  const pool = c.filter(e => wdOf(e.date) === wd);
  const use = pool.length ? pool : c;
  if (!use.length) return b.start;
  const m = {}; use.forEach(e => m[e.start] = (m[e.start]||0) + 1);
  return Object.entries(m).sort((a,b2) => b2[1]-a[1] || a[0].localeCompare(b2[0]))[0][0];
}
function suggestions(wd){
  const m = {};
  counted().filter(e => wdOf(e.date) === wd).forEach(e => m[e.blockId] = (m[e.blockId]||0) + 1);
  return Object.entries(m).map(([id,n]) => ({block:S.blocks.find(b => b.id === id), n, time:learnedTime(id,wd)}))
    .filter(s => s.block && !s.block.archived).sort((a,b) => b.n - a.n);
}

function nextEntry(){
  const now = Date.now(); let best = null, bt = Infinity;
  for (const e of S.entries){
    const b = blockOf(e); if (!b || !b.sync || e.done === false) continue;
    const [s,en] = span(e); if (en.getTime() <= now) continue;
    if (s.getTime() < bt){ bt = s.getTime(); best = e; }
  }
  return best;
}
function untilText(e){
  const [s,en] = span(e), now = new Date();
  if (s <= now && now < en) return t('running');
  const mins = Math.round((s - now)/60000);
  if (mins < 60) return t('inMin', mins);
  if (mins < 24*60) return t('inHM', Math.floor(mins/60), mins%60);
  return t('inDays', Math.round((parse(e.date) - parse(todayStr()))/864e5));
}
const doneIn = (from,to) => S.entries.filter(e => e.date >= from && e.date <= to && e.done === true && blockOf(e) && blockOf(e).sync).length;
function renderHome(){
  const now = new Date(), td = todayStr(), mon = mondayOf(now), from = ymd(mon), to = ymd(addDays(mon,6));

  const all = S.entries.filter(e => e.done === true && blockOf(e) && blockOf(e).sync);
  const cnt = {}; all.forEach(e => cnt[e.blockId] = (cnt[e.blockId]||0) + 1);

  const weeks = [5,4,3,2,1,0].map(i => { const m = addDays(mon,-7*i); return {w:isoWeek(m).w, n:doneIn(ymd(m), ymd(addDays(m,6))), cur:i===0}; });
  const mx = Math.max(1, ...weeks.map(x => x.n));

document.addEventListener('click', ev => {
  if (ev.target.id === 'sheetBg') return closeSheet();
  const el = ev.target.closest('[data-act]'); if (!el) return;
  ev.stopPropagation();
  const a = el.dataset.act, id = el.dataset.id, e = id ? entryById(id) : null;
  switch (a){
    case 'prev': view.mon = addDays(view.mon,-7); render(); break;
    case 'next': view.mon = addDays(view.mon,7); render(); break;
    case 'thisweek': view.mon = mondayOf(new Date()); render(); break;
    case 'home': page = 'home'; render(); break;
    case 'week': page = 'week'; view.mon = mondayOf(new Date()); render(); break;
    case 'gonext': if (e){ page = 'week'; view.mon = mondayOf(parse(e.date)); render(); } break;
    case 'close': closeSheet(); break;
    case 'add': openAdd(el.dataset.date); break;
    case 'addblock': {
      const b = S.blocks.find(x => x.id === id), ds = el.dataset.date;
      S.entries.push({id:uid(), blockId:id, date:ds, start:learnedTime(id, wdOf(ds)), dur:b.dur, done:null});
      save(); closeSheet(); render(); break; }
    case 'edit': openEdit(id); break;
    case 'time': openTime(id); break;
    case 'tadj': if (e){
      if (el.dataset.f === 'start') e.start = fmtMin(Math.min(1425, Math.max(0, toMin(e.start) + (+el.dataset.d))));
      else e.dur = Math.min(600, Math.max(15, (e.dur || 0) + (+el.dataset.d)));
      save(); render(); openTime(id); } break;
    case 'resetlook': if (e){ delete e.name; delete e.loc; delete e.color; save(); render(); openEdit(id); } break;
    case 'savelook': if (e){ const b = blockOf(e), Lk = look(e), nb = {id:'b_' + uid(), name:Lk.name, loc:Lk.loc, color:Lk.color, start:e.start, dur:e.dur, sync:b.sync};

document.addEventListener('change', ev => {

  else if (f === 'dur' && e){ e.dur = Math.max(0, parseInt(ev.target.value,10) || 0); save(); render(); if (quickId === e.id) openTime(e.id); }

function saveBlock(id){

function download(name, text, type){
  const blob = new Blob([text], {type}), file = new File([blob], name, {type});
  if (navigator.canShare && navigator.canShare({files:[file]})){ navigator.share({files:[file]}).catch(() => {}); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
}

const weekEntries = mon => { const from = ymd(mon), to = ymd(addDays(mon,6)); return S.entries.filter(e => e.date >= from && e.date <= to && blockOf(e) && blockOf(e).sync); };
function span(e){ const [h,m] = e.start.split(':').map(Number); const s = parse(e.date); s.setHours(h,m,0,0); const en = new Date(s.getTime() + (e.dur||60)*60000); return [s,en]; }
const localIso = d => `${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}:00`;
function exportIcs(){
  const wk = isoWeek(view.mon), list = weekEntries(view.mon);
  if (!list.length) return toast(t('noEvents'));
  const stamp = new Date().toISOString().replace(/[-:]|\.\d{3}/g,'');
  const fl = d => localIso(d).replace(/[-:]/g,'');
  const tx = s => String(s||'').replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n');
  const Ls = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Workout//DE','CALSCALE:GREGORIAN'];
  list.forEach(e => { const Lk = look(e), [s,en] = span(e);
    Ls.push('BEGIN:VEVENT',`UID:${e.id}@workout`,`DTSTAMP:${stamp}`,`DTSTART:${fl(s)}`,`DTEND:${fl(en)}`,`SUMMARY:${tx(Lk.name)}`,...(Lk.loc?[`LOCATION:${tx(Lk.loc)}`]:[]),'END:VEVENT'); });
  Ls.push('END:VCALENDAR');
  download(`workouts-${wk.key}.ics`, Ls.join('\r\n'), 'text/calendar');
}

let dragUsed = false;
(function(){
  let d = null; const HOLD = 380;
  const app = $('#app');
  const arm = () => {
    if (!d || d.moving) return;
    d.moving = true; dragUsed = true;
    const r = d.el.getBoundingClientRect(), g = d.el.cloneNode(true);
    g.classList.add('ghost'); g.style.width = r.width + 'px'; g.style.height = r.height + 'px';
    g.style.left = r.left + 'px'; g.style.top = r.top + 'px';
    document.body.appendChild(g); d.ghost = g; d.dx = d.cx - r.left; d.dy = d.cy - r.top;
    d.el.classList.add('lift');
    if (navigator.vibrate) navigator.vibrate(12);
  };
  app.addEventListener('pointerdown', ev => {
    const c = ev.target.closest('.chip2'); if (!c || c.classList.contains('cw') || ev.button > 0 || ev.target.closest('.tm')) return;
    d = {id:c.dataset.id, el:c, x:ev.clientX, y:ev.clientY, cx:ev.clientX, cy:ev.clientY, moving:false, ghost:null, over:null, pid:ev.pointerId};
    d.timer = setTimeout(arm, HOLD);
    try { c.setPointerCapture(ev.pointerId); } catch(e){}
  });
  app.addEventListener('pointermove', ev => {
    if (!d || ev.pointerId !== d.pid) return;
    d.cx = ev.clientX; d.cy = ev.clientY;
    if (!d.moving){
      if (Math.hypot(ev.clientX - d.x, ev.clientY - d.y) > 10){ clearTimeout(d.timer); try { d.el.releasePointerCapture(d.pid); } catch(e){} d = null; }
      return;
    }
    d.ghost.style.left = (ev.clientX - d.dx) + 'px'; d.ghost.style.top = (ev.clientY - d.dy) + 'px';
    const el2 = document.elementFromPoint(ev.clientX, ev.clientY), row = el2 && el2.closest ? el2.closest('.day') : null;
    if (row !== d.over){ if (d.over) d.over.classList.remove('drop'); d.over = row; if (row) row.classList.add('drop'); }
  });
  const end = ev => {
    if (!d || ev.pointerId !== d.pid) return;
    clearTimeout(d.timer);
    const s2 = d; d = null;
    if (s2.ghost) s2.ghost.remove();
    if (s2.over) s2.over.classList.remove('drop');
    if (s2.moving){
      const nd = s2.over && s2.over.dataset.date, e = entryById(s2.id);
      if (e && nd && e.date !== nd){ e.date = nd; save(); }
      render();
    } else if (ev.type === 'pointerup') openEdit(s2.id);
  };
  app.addEventListener('pointerup', end);
  app.addEventListener('pointercancel', end);
  app.addEventListener('contextmenu', ev => { if (ev.target.closest('.chip2')) ev.preventDefault(); });
})();

async function showCrewWeek(){
  cmon = cmon || mondayOf(new Date());
  openSheet(`<h3>${t('c_title')}</h3><p class="hint">${t('c_load')}</p>`);
  let docs;
  try {
    const {fs, db} = FB, q = await fs.getDocs(fs.collection(db, 'crews', CREW.id, 'plans'));
    docs = q.docs.map(d => Object.assign({uid: d.id}, d.data()));
  } catch(e){ cerr(e); return mainCrewSheet(); }
  const wk = isoWeek(cmon);
  let h = `<h3>${t('c_title')} · ${t('wk')} ${wk.w}</h3><p class="hint">${fmtDM(cmon)} – ${fmtDMY(addDays(cmon,6))}</p>
    <div class="step"><button data-act="cprev">‹</button><button data-act="cthis">${t('today')}</button><button data-act="cnext">›</button></div>`;
  let any = false;
  for (let i = 0; i < 7; i++){
    const ds = ymd(addDays(cmon, i)), items = [];
    docs.forEach(p => (p.entries || []).filter(x => x && x.date === ds).forEach(x => items.push({x, who: p.name, uid: p.uid, me: p.uid === ME.uid})));
    if (!items.length) continue;
    any = true;
    items.sort((a,b) => String(a.x.start).localeCompare(String(b.x.start)));
    h += `<h4>${dn(i)} ${fmtDM(addDays(cmon,i))}</h4>` + items.map(({x, who, me, uid}) =>
      `<div class="pend" style="border-left:4px solid ${safeColor(x.color)}"><div class="n"><b>${esc(cslim(who))}${me ? ' (' + t('c_you') + ')' : ''}</b><small>${esc(cslim(x.start))} · ${esc(cslim(x.name))}${x.loc ? ' · ' + esc(cslim(x.loc)) : ''}</small></div><button data-act="cthread" data-t="${esc(thr(uid, x))}" data-title="${esc(cslim(who) + ' · ' + dn(i) + ' ' + cslim(x.start) + ' ' + cslim(x.name))}" aria-label="${t('c_thread')}">💬</button></div>`).join('');
  }
  if (!any) h += `<p class="hint">${t('c_noPlans')}</p>`;
  h += `<div class="btnrow"><button data-act="cback">${t('back')}</button><button data-act="close">${t('c_cancel')}</button></div>`;
  openSheet(h);
}

/* ---- Teilen ---- */
function schedulePublish(){
  if (!(FB && ME && PROF && PROF.name && CREWS.length)) return;
  clearTimeout(pubT); pubT = setTimeout(publishPlan, 1500);
}
async function publishPlan(){
  if (!(FB && ME && PROF && CREWS.length)) return;
  const {fs, db} = FB, from = ymd(addDays(new Date(), -7));
  const entries = S.entries.filter(e => blockOf(e) && blockOf(e).sync && e.date >= from).slice(0, 300).map(e => {
    const Lk = look(e);
    return {date: e.date, start: e.start, dur: e.dur || 0, name: cslim(Lk.name), loc: cslim(Lk.loc), color: safeColor(Lk.color)};
  });
  for (const cr of CREWS){
    const ref = fs.doc(db, 'crews', cr.id, 'plans', ME.uid);
    try {
      if (!sharing(cr.id)) await fs.deleteDoc(ref);
      else await fs.setDoc(ref, {name: PROF.name, entries, updated: fs.serverTimestamp()});
    } catch(e){ cerr(e); }
  }
  crewRefresh();
}
async function afterLogin(){ await loadCrewState(); showCrew(); }
async function setProfile(extra){
  const {fs, db} = FB;
  PROF = Object.assign({}, PROF || {}, extra);
  await fs.setDoc(fs.doc(db, 'users', ME.uid), {name: PROF.name, crewIds: PROF.crewIds || []});
}
async function leaveCrew(cr){
  const {fs, db} = FB;
  cr = cr || CREW; if (!cr) return;
  try { await deleteMyMessages(cr.id); } catch(e){}
  try { await fs.deleteDoc(fs.doc(db, 'crews', cr.id, 'plans', ME.uid)); } catch(e){}
  const rest = (cr.members || []).filter(u => u !== ME.uid);
  if (rest.length === 0 && cr.owner === ME.uid) await fs.deleteDoc(fs.doc(db, 'crews', cr.id));
  else await fs.updateDoc(fs.doc(db, 'crews', cr.id), {members: fs.arrayRemove(ME.uid)});
  CREWS = CREWS.filter(x => x.id !== cr.id); delete CPALL[cr.id];
  await setProfile({crewIds: (PROF.crewIds || []).filter(x => x !== cr.id)});
  setActive(); save();
}

/* ---- Chat ---- */
function chatStop(){ if (chatUnsub){ try { chatUnsub(); } catch(e){} chatUnsub = null; } }
let chatThread = 'crew';
function openChat(thread, title, back){
  openSheet(`<h3>${esc(title)}</h3><p class="hint">${t('c_chatRules')}</p><div id="chatList" class="chatlist"><p class="hint">${t('c_load')}</p></div>
    <div class="chatrow"><input type="text" id="chat-in" maxlength="500" placeholder="${t('c_msgPh')}"><button class="primary" data-act="csend">${t('c_send')}</button></div>
    <div class="btnrow"><button data-act="${back}">${t('back')}</button><button data-act="close">${t('c_cancel')}</button></div>`);
  chatThread = thread;
  const {fs, db} = FB;
  const q = fs.query(fs.collection(db, 'crews', CREW.id, 'messages'), fs.where('thread', '==', thread));
  chatUnsub = fs.onSnapshot(q, snap => {
    const ms = x => (x.ts && x.ts.toMillis) ? x.ts.toMillis() : Date.now();
    const msgs = snap.docs.map(d => Object.assign({id: d.id}, d.data({serverTimestamps: 'estimate'}))).sort((a,b) => ms(a) - ms(b)).slice(-100);
    const el = document.getElementById('chatList'); if (!el) return;
    const td = todayStr();
    el.innerHTML = msgs.length ? msgs.map(m => {
      const d = new Date(ms(m)), me = m.uid === ME.uid, hm = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
      const when = ymd(d) === td ? hm : `${fmtDM(d)} ${hm}`;
      return `<div class="msg ${me ? 'me' : ''}"><div class="mh"><b>${esc(cslim(m.name))}</b><small>${when}</small>${me ? `<i data-act="cmdel" data-id="${esc(m.id)}" aria-label="${t('c_delMsg')}">×</i>` : ''}</div><p>${esc(String(m.text || '').slice(0, 500))}</p></div>`;
    }).join('') : `<p class="hint">${t('c_noMsg')}</p>`;
    el.scrollTop = el.scrollHeight;
  }, e => cerr(e));
}
async function sendChat(){
  const inp = document.getElementById('chat-in'); if (!inp) return;
  const text = inp.value.trim(); if (!text) return;
  inp.value = '';
  const {fs, db} = FB;
  try { await fs.addDoc(fs.collection(db, 'crews', CREW.id, 'messages'), {uid: ME.uid, name: PROF.name, text: text.slice(0, 500), thread: chatThread, ts: fs.serverTimestamp()}); }
  catch(e){ inp.value = text; cerr(e); }
}
async function deleteMyMessages(crewId){
  const {fs, db} = FB;
  const q = await fs.getDocs(fs.query(fs.collection(db, 'crews', crewId, 'messages'), fs.where('uid', '==', ME.uid)));
  await Promise.all(q.docs.map(d => fs.deleteDoc(d.ref)));
}
document.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target && ev.target.id === 'chat-in'){ ev.preventDefault(); sendChat(); } });

/* ---- Startseiten-Panel ---- */
async function crewRefresh(){
  if (!(FB && ME && CREWS.length)){ if (crewReady){ delete S.settings.cc; CLAST = null; CPLANS = []; if (page === 'home') render(); } return; }
  const {fs, db} = FB;
  await Promise.all(CREWS.map(async cr => {
    try { const q = await fs.getDocs(fs.collection(db, 'crews', cr.id, 'plans')); CPALL[cr.id] = q.docs.map(d => Object.assign({uid: d.id}, d.data())); } catch(e){}
  }));
  setActive();
  CLAST = null;
  if (CREW){
    try {
      const q = await fs.getDocs(fs.query(fs.collection(db, 'crews', CREW.id, 'messages'), fs.orderBy('ts', 'desc'), fs.limit(15)));
      const m = q.docs.map(d => d.data()).find(x => x.thread === 'crew');
      if (m) CLAST = {name: cslim(m.name), text: String(m.text || '').slice(0, 90)};
    } catch(e){}
  }
  try {
    const td = todayStr(), plans = [];
    (CPLANS || []).forEach(p => { if (ME && p.uid === ME.uid) return; plans.push({uid: p.uid, name: p.name, entries: (p.entries || []).filter(x => x && x.date >= td).slice(0, 12)}); });
    S.settings.cc = {act: CREW ? CREW.id : null, crews: CREWS.map(x => ({id: x.id, name: x.name, n: (x.members || []).length})), plans, last: CLAST};
    localStorage.setItem(KEY, JSON.stringify(S));
  } catch(e){}
  if (page === 'home' || page === 'cweek') render();
}
function renderCrewWeekPage(){
  cmon = cmon || mondayOf(new Date());
  const mon = cmon, sun = addDays(mon, 6), wk = isoWeek(mon), td = todayStr(), plans = CPLANS || [];
  let h = `<div class="top"><button data-act="cwprev">‹</button><div class="ttl"><b>${t('c_title')} · ${t('wk')} ${wk.w}</b><span>${esc(CREW ? CREW.name || '' : '')} · ${fmtDM(mon)} – ${fmtDMY(sun)}</span></div><button data-act="cwnext">›</button></div><div class="days">`;
  for (let i = 0; i < 7; i++){
    const d = addDays(mon, i), ds = ymd(d), items = [];
    plans.forEach(p => (p.entries || []).filter(x => x && x.date === ds).forEach(x => items.push({x, who: p.name, uid: p.uid})));
    items.sort((a, b) => String(a.x.start).localeCompare(String(b.x.start)));
    const chips = items.map(({x, who, uid}) => {
      const me = ME && uid === ME.uid, nm = cslim(who) + (me ? ' (' + t('c_you') + ')' : '');
      return `<div class="chip2 cw" style="--c:${safeColor(x.color)}" data-act="cthread" data-t="${esc(thr(uid, x))}" data-title="${esc(nm + ' · ' + dn(i) + ' ' + cslim(x.start) + ' ' + cslim(x.name))}"><b>${esc(nm)}</b><div class="meta"><span class="tm" style="pointer-events:none">${esc(cslim(x.start))}</span><span class="lc">${esc(cslim(x.name))}</span></div></div>`;
    }).join('');
    h += `<section class="day ${ds === td ? 'today' : ''}"><div class="dl"><b>${dn(i)}</b><small>${fmtDM(d)}</small></div><div class="chips">${chips || `<div class="free">${t('free')}</div>`}</div></section>`;
  }
  h += `</div><div class="bar" style="grid-template-columns:auto 1fr 1fr 1fr"><button class="ic" data-act="home" aria-label="Home">⌂</button><button data-act="cwthis">${t('today')}</button><button data-act="hchat">${t('c_btnChat')}</button><button data-act="hmenu">${t('c_btnMenu')}</button></div>`;
  $('#app').innerHTML = h;
}
function openCrewWeekPage(){ page = 'cweek'; cmon = mondayOf(new Date()); closeSheet(); render(); crewRefresh(); }
function crewPanel(){
  const btn = (a, l, p) => `<button ${p ? 'class="primary" ' : ''}data-act="${a}">${l}</button>`;
  const cc = S.settings.cc || null;
  const known = CREW ? true : !!(cc && cc.crews && cc.crews.length);
  if (!S.settings.crewOn && !known) return `<div class="panel cp inv"><small>${t('c_title')}</small><p>${t('c_startHint')}</p><div class="cbtns">${btn('crew', t('c_start'), true)}</div></div>`;
  const crews = CREW ? CREWS.map(x => ({id: x.id, name: x.name})) : (cc && cc.crews) || [];
  const actId = CREW ? CREW.id : (cc && cc.act) || (crews[0] && crews[0].id);
  const cur = crews.find(x => x.id === actId) || crews[0] || {name: ''};
  const nMem = CREW ? (CREW.members || []).length : ((cc && cc.crews.find(x => x.id === actId)) || {}).n || 0;
  const plans = CREW ? (CPLANS || []) : (cc && cc.plans) || [];
  const last = CREW ? CLAST : (cc && cc.last) || null;
  const now = Date.now(), td = todayStr(), items = [];
  plans.filter(p => p.uid !== (ME && ME.uid)).forEach(p => (p.entries || []).forEach(x => {
    if (!x || !x.date || !x.start || x.date < td) return;
    const [h, m] = String(x.start).split(':').map(Number), s = parse(x.date); s.setHours(h || 0, m || 0, 0, 0);
    if (s.getTime() + (x.dur || 60) * 60000 > now) items.push({s: s.getTime(), who: p.name, x});
  }));
  items.sort((a, b) => a.s - b.s);
  const rows = items.slice(0, 5).map(({who, x}) => {
    const dd = Math.round((parse(x.date) - parse(td)) / 864e5);
    const day = dd === 0 ? t('today') : dd === 1 ? t('tomorrow') : `${dn(wdOf(x.date))} ${fmtDM(parse(x.date))}`;
    return `<div class="r"><span class="d" style="--c:${safeColor(x.color)}"><b>${esc(cslim(who))}</b> · ${esc(day)} ${esc(cslim(x.start))}</span><span>${esc(cslim(x.name))}${x.loc ? ' · ' + esc(cslim(x.loc)) : ''}</span></div>`;
  }).join('');
  const tabs = crews.length > 1 ? `<div class="ctabs">${crews.map(x => `<button data-act="cact" data-id="${esc(x.id)}" class="${x.id === actId ? 'on' : ''}">${esc(x.name || 'Crew')}</button>`).join('')}</div>` : '';
  const lastHtml = last ? `<div class="cl">💬 <b>${esc(cslim(last.name))}:</b> ${esc(String(last.text || '').slice(0, 90))}</div>` : `<div class="cl" style="opacity:.6">💬 ${t('c_chatNone')}</div>`;
  const status = CREW ? '' : (CERR ? `<div class="cl" style="color:#ff9a8f;white-space:normal">⚠ ${esc(CERR.slice(0, 50))} <u data-act="hreload">${t('c_retry')}</u></div>` : `<div class="cl" style="opacity:.6">${t('c_loading')}</div>`);
  return `<div class="panel cp"><small>${t('c_title')} · ${esc(cur.name || '')}${nMem ? ' · ' + t('c_members', nMem) : ''}</small>${tabs}<div class="rows">${rows || `<p class="hint" style="color:var(--mut);margin:6px 0 2px">${t('c_homeNone')}</p>`}</div>${status}${lastHtml}<div class="cbtns">${btn('hchat', t('c_btnChat'), true)}${btn('hweek', t('c_btnWeek'))}${btn('hmenu', t('c_btnMenu'))}</div></div>`;
}
function crewBlocks(){
  const g = {};
  Object.values(CPALL).forEach(arr => (arr || []).forEach(p => {
    if (ME && p.uid === ME.uid) return;
    (p.entries || []).forEach(x => {
      if (!x || !x.name) return;
      const key = (x.name + '|' + (x.loc || '')).toLowerCase();
      const o = g[key] || (g[key] = {name: cslim(x.name), loc: cslim(x.loc), color: safeColor(x.color), who: new Set(), n: 0, st: {}, du: {}});
      o.who.add(p.uid); o.n++; o.st[x.start] = (o.st[x.start] || 0) + 1; o.du[x.dur] = (o.du[x.dur] || 0) + 1;
    });
  }));
  const have = new Set(S.blocks.map(b => (b.name + '|' + (b.loc || '')).toLowerCase()));
  const top = o => Object.entries(o).sort((a, b) => b[1] - a[1])[0][0];
  return Object.entries(g).filter(([k]) => !have.has(k)).map(([k, o]) => ({name: o.name, loc: o.loc, color: o.color, m: o.who.size, n: o.n, start: top(o.st), dur: top(o.du)}))
    .sort((a, b) => b.m - a.m || b.n - a.n).slice(0, 12);
}

/* ---- Aktionen ---- */
async function crewAct(a, el){
  const v = id => { const x = document.getElementById(id); return x ? x.value.trim() : ''; };
  try {
    switch (a){
      case 'crew': return openCrew();
      case 'crewok':
        if (!$('#c-consent').checked) return toast(t('c_consent'), 4000);
        S.settings.crewConsent = true; save(); return openCrew();
      case 'clogin': case 'creg': {
        const mail = v('c-mail'), pw = document.getElementById('c-pw').value;
        if (!mail) return toast(t('c_needMail'));
        const {au, auth} = FB;
        if (a === 'clogin') await au.signInWithEmailAndPassword(auth, mail, pw);
        else await au.createUserWithEmailAndPassword(auth, mail, pw);
        ME = auth.currentUser; return afterLogin(); }
      case 'cgoogle': {
        const {au, auth} = FB;
        await au.signInWithPopup(auth, new au.GoogleAuthProvider());
        ME = auth.currentUser; return afterLogin(); }
      case 'creset': {
        const mail = v('c-mail'); if (!mail) return toast(t('c_needMail'));
        await FB.au.sendPasswordResetEmail(FB.auth, mail); return toast(t('c_resetSent')); }
      case 'cname': {
        const n = v('c-name'); if (!n || n.length > 30) return toast(t('c_needName'));
        await setProfile({name: n}); if (CREWS.length){ toast(t('c_renamed')); publishPlan(); } return showCrew(); }
      case 'ccreate': {
        const n = v('c-cname') || PROF.name + '’s Crew', {fs, db} = FB;
        let code = newCode();
        for (let i = 0; i < 5 && (await fs.getDoc(fs.doc(db, 'crews', code))).exists(); i++) code = newCode();
        await fs.setDoc(fs.doc(db, 'crews', code), {name: n.slice(0, 30), owner: ME.uid, members: [ME.uid], created: fs.serverTimestamp()});
        await setProfile({crewIds: [...(PROF.crewIds || []), code]});
        S.settings.actCrew = code; S.settings.crewOn = true; save();
        await loadCrewState(); render(); publishPlan(); return showCrew(); }
      case 'cjoin': {
        const code = v('c-code').toUpperCase().replace(/[^A-Z0-9]/g, ''), {fs, db} = FB;
        if (code.length !== 8) return toast(t('c_wrongCode'));
        let c; try { c = await fs.getDoc(fs.doc(db, 'crews', code)); } catch(e){ return toast(t('c_wrongCode')); }
        if (!c.exists()) return toast(t('c_wrongCode'));
        const mem = c.data().members || [];
        if (!mem.includes(ME.uid)){
          if (mem.length >= MAXCREW) return toast(t('c_full'));
          await fs.updateDoc(fs.doc(db, 'crews', code), {members: fs.arrayUnion(ME.uid)});
        }
        await setProfile({crewIds: [...new Set([...(PROF.crewIds || []), code])]});
        S.settings.actCrew = code; S.settings.crewOn = true; save();
        await loadCrewState(); render(); publishPlan(); return showCrew(); }
      case 'ccopy':
        try { await navigator.clipboard.writeText(CREW.id); } catch(e){}
        return toast(t('c_copied'));
      case 'cshare':
        S.settings.noShare = S.settings.noShare || {};
        if (sharing(CREW.id)) S.settings.noShare[CREW.id] = true; else delete S.settings.noShare[CREW.id];
        save(); await publishPlan();
        toast(sharing(CREW.id) ? t('c_published') : t('c_shareOff')); return mainCrewSheet();
      case 'cview': return openCrewWeekPage();
      case 'cprev': cmon = addDays(cmon, -7); return showCrewWeek();
      case 'cnext': cmon = addDays(cmon, 7); return showCrewWeek();
      case 'cthis': cmon = mondayOf(new Date()); return showCrewWeek();
      case 'cback': return showCrew();
      case 'cweek': return showCrewWeek();
      case 'cren': return nameSheet(true);
      case 'cmore': return noCrewSheet('back');
      case 'cact': setActive(el.dataset.id); save(); if (sheetOpen()) mainCrewSheet(); render(); crewRefresh(); return;
      case 'hchat': if (!(FB && ME && CREW)) return openCrew(); return openChat('crew', t('c_chat'), 'close');
      case 'hweek': if (!(FB && ME && CREW)) return openCrew(); return openCrewWeekPage();
      case 'cwprev': cmon = addDays(cmon, -7); return render();
      case 'cwnext': cmon = addDays(cmon, 7); return render();
      case 'cwthis': cmon = mondayOf(new Date()); return render();
      case 'hmenu': return openCrew();
      case 'hreload': CERR = ''; crewReady = false; render(); return crewStart();
      case 'addcrew': {
        const d = el.dataset, name = cslim(d.name), loc = cslim(d.loc), color = safeColor(d.color);
        const start = /^\d\d:\d\d$/.test(d.start) ? d.start : '18:00', dur = Math.min(600, Math.max(0, parseInt(d.dur, 10) || 60));
        let b = S.blocks.find(x => (x.name + '|' + (x.loc || '')).toLowerCase() === (name + '|' + loc).toLowerCase());
        if (b) b.archived = false; else { b = {id: 'b_' + uid(), name, loc, color, start, dur, sync: true}; S.blocks.push(b); }
        S.entries.push({id: uid(), blockId: b.id, date: d.date, start: learnedTime(b.id, wdOf(d.date)), dur: b.dur, done: null});
        save(); closeSheet(); render(); return; }
      case 'cchat': return openChat('crew', t('c_chat'), 'cback');
      case 'cthread': return openChat(el.dataset.t, el.dataset.title, 'close');
      case 'csend': return sendChat();
      case 'cmdel': { const {fs, db} = FB; await fs.deleteDoc(fs.doc(db, 'crews', CREW.id, 'messages', el.dataset.id)); return; }
      case 'cleave':
        if (!confirm(t('c_leaveQ'))) return;
        await leaveCrew(); S.settings.crewOn = CREWS.length > 0; save(); toast(t('c_left')); crewRefresh(); render(); return showCrew();
      case 'clogout':
        await FB.au.signOut(FB.auth); ME = null; PROF = null; CREW = null; CREWS = []; CPALL = {}; CPLANS = []; CLAST = null; delete S.settings.cc; S.settings.crewOn = false; save(); render(); return loginSheet();
      case 'cdel': {
        if (!confirm(t('c_delQ'))) return;
        const {fs, db} = FB;
        for (const cr of CREWS.slice()) await leaveCrew(cr);
        try { await fs.deleteDoc(fs.doc(db, 'users', ME.uid)); } catch(e){}
        await FB.au.deleteUser(FB.auth.currentUser);
        ME = null; PROF = null; CREW = null; CREWS = []; CPALL = {}; CPLANS = []; CLAST = null; delete S.settings.cc; S.settings.crewOn = false; save(); render();
        toast(t('c_deleted')); return closeSheet(); }
    }
  } catch(e){ cerr(e); }
}

/* ---------- Gesten: nach rechts wischen = zurück, nach unten ziehen = aktualisieren ---------- */
(function(){
  const ptr = document.createElement('div'); ptr.id = 'ptr'; document.body.appendChild(ptr);
  let g = null, busy = false;
  const setPtr = (dy, txt) => { ptr.textContent = txt; ptr.style.opacity = dy > 8 ? '1' : '0'; ptr.style.transform = `translate(-50%, ${Math.min(dy, 110) * 0.6 - 40}px)`; };
  async function refresh(){
    busy = true; setPtr(70, t('ptrBusy'));
    try { if (typeof crewReady !== 'undefined' && crewReady) await crewRefresh(); else if (S.settings.crewConsent) await crewStart(); } catch(e){}
    render(); setPtr(0, ''); busy = false; toast(t('refreshed'), 1500);
  }
  window.appRefresh = refresh;
  document.addEventListener('touchstart', e => {
    dragUsed = false;
    if (e.touches.length !== 1 || sheetOpen() || busy){ g = null; return; }
    const p = e.touches[0];
    g = {x: p.clientX, y: p.clientY, t: Date.now(), tg: e.target, pull: (page === 'home' || page === 'cweek') && p.clientY < 220};
  }, {passive: true});
  document.addEventListener('touchmove', e => {
    if (!g || !g.pull || dragUsed) return;
    const p = e.touches[0], dy = p.clientY - g.y, dx = p.clientX - g.x;
    if (dy > 10 && Math.abs(dx) < dy * 0.6) setPtr(dy, dy > 85 ? t('ptrGo') : t('ptrPull')); else if (dy <= 10) setPtr(0, '');
  }, {passive: true});
  document.addEventListener('touchend', e => {
    if (!g) return;
    const s2 = g; g = null;
    const p = e.changedTouches[0], dx = p.clientX - s2.x, dy = p.clientY - s2.y;
    if (dragUsed){ setPtr(0, ''); return; }
    if (s2.pull && dy > 85 && Math.abs(dx) < dy * 0.6){ refresh(); return; }
    setPtr(0, '');
    if (dx > 80 && Math.abs(dy) < dx * 0.5 && Date.now() - s2.t < 800 && !sheetOpen() && !(s2.tg.closest && s2.tg.closest('.ctabs, input, select'))){
      if (page !== 'home'){ page = 'home'; render(); }
    }
  }, {passive: true});
  document.addEventListener('touchcancel', () => { g = null; setPtr(0, ''); }, {passive: true});
  setInterval(() => { if (!document.hidden && !sheetOpen() && (page === 'home' || page === 'cweek') && typeof crewReady !== 'undefined' && crewReady) crewRefresh(); }, 120000);
})();

/* ---------- Start ---------- */
// iOS-Homescreen-Apps: Das Layout-Viewport ist mit viewport-fit=cover oft um die Statusleiste zu kurz.
// Dann sorgt die volle Bildschirmhöhe dafür, dass Hintergrund und Leiste ganz nach unten reichen.
function isSA(){ return window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches); }
function gapNow(){ const portrait = window.matchMedia ? window.matchMedia('(orientation: portrait)').matches : true; const g = window.screen.height - window.innerHeight; return (isSA() && portrait && g > 20 && g < 120) ? g : 0; }
function isSA(){ return window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches); }
// iOS-Fehler: Manchmal startet die Homescreen-App mit einem um die Statusleiste (ca. 59 px) zu kurzen Fenster und ohne oberen Sicherheitsabstand.
// Die Seite kann das Fenster nicht vergrößern. Wir schieben den Inhalt aber um genau diese Höhe nach unten und blenden den Rand weich aus.
function applyGap(){
  const portrait = window.matchMedia ? window.matchMedia('(orientation: portrait)').matches : true;
  const g = window.screen.height - window.innerHeight;
  const on = isSA() && portrait && g > 20 && g < 120;
  const r = document.documentElement;
  r.style.setProperty('--gt', on ? g + 'px' : '0px');
  r.classList.toggle('gapfix', on);
}
applyGap(); [100, 400, 1000, 2500].forEach(ms => setTimeout(applyGap, ms));
addEventListener('resize', applyGap); addEventListener('orientationchange', () => setTimeout(applyGap, 300)); addEventListener('pageshow', applyGap);
applySplash();
(function(){
  const sp = $('#splash'); if (!sp) return;
  let gone = false;
  const hide = () => {
    if (gone) return; gone = true; sp.classList.add('out'); setTimeout(() => sp.remove(), 700);
    setTimeout(() => {
      if (!S.settings.guideSeen) openDoc('guide', true);
      else if (S.settings.seenVersion !== VERSION) openDoc('changelog');
      S.settings.seenVersion = VERSION; save();
    }, 750);
  };
  setTimeout(hide, 2600); sp.addEventListener('click', hide);
})();
document.addEventListener('visibilitychange', () => { if (!document.hidden){ applyGap(); if (typeof crewRefresh === 'function' && S.settings.crewConsent){ if (crewReady) crewRefresh(); else crewStart(); } if (page === 'home') render(); } });
if (S.settings.crewConsent) crewStart();
render();
if ('serviceWorker' in navigator){
  const had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (had) toast(t('updated'), 6000); });
}
